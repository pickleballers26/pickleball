<!doctype html><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Encrypt token</title>
<body style="font:16px system-ui;max-width:560px;margin:24px auto;padding:0 16px">
<h2>Encrypt your GitHub token</h2>
<p>Paste your token and pick your league passcode. Copy the result into <code>ENC_TOKEN</code> in index.html. Nothing leaves your browser.</p>
<p><label>GitHub token<br><input id="t" style="width:100%" autocomplete="off"></label></p>
<p><label>Passcode<br><input id="p" style="width:100%" autocomplete="off"></label></p>
<button id="go">Encrypt</button>
<p><textarea id="out" rows="6" style="width:100%" readonly></textarea></p>
<script>
document.getElementById("go").onclick=async()=>{
  const t=document.getElementById("t").value.trim(),p=document.getElementById("p").value.trim().toUpperCase();
  if(!t||!p)return;
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(t)));
  const all=new Uint8Array(16+12+ct.length);all.set(salt);all.set(iv,16);all.set(ct,28);
  document.getElementById("out").value=btoa(String.fromCharCode.apply(null,all));
};
</script>
